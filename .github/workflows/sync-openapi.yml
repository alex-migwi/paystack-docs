name: Sync Paystack OpenAPI Spec

on:
  repository_dispatch:
    types: [openapi_updated, openapi-update]
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *' # Daily sync check at midnight UTC

permissions:
  contents: write

jobs:
  sync-spec:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout paystack-docs repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Download latest Paystack OpenAPI spec from upstream
        run: |
          mkdir -p public
          curl -sSL https://raw.githubusercontent.com/PaystackOSS/openapi/main/paystack.yaml -o public/paystack.yaml

      - name: Install dependencies
        run: npm ci || npm install

      - name: Compile OpenAPI YAML to JSON
        run: npm run compile-spec

      - name: Commit and push spec updates if changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add public/paystack.yaml public/paystack.json
          if git diff --staged --quiet; then
            echo "No changes in Paystack OpenAPI specification."
          else
            git commit -m "chore(openapi): sync latest Paystack OpenAPI spec from PaystackOSS/openapi"
            git push
          fi
