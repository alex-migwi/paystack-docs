name: Sync Enriched Paystack Spec

on:
  repository_dispatch:
    types: [enriched_spec_updated, spec_enriched, openapi-update]
  workflow_dispatch:
    inputs:
      spec_url:
        description: 'Custom URL to paystack-enriched.json'
        required: false
        default: 'https://raw.githubusercontent.com/Alex-Muturi/paystack-spec-enriched/main/dist/paystack-enriched.json'
  schedule:
    - cron: '0 0 * * *' # Daily sync check at midnight UTC

permissions:
  contents: write

jobs:
  sync-enriched-spec:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout paystack-docs repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Fetch Enriched Spec from GitHub
        env:
          ENRICHED_SPEC_URL: ${{ inputs.spec_url || 'https://raw.githubusercontent.com/Alex-Muturi/paystack-spec-enriched/main/dist/paystack-enriched.json' }}
        run: node scripts/fetch-enriched-spec.js

      - name: Compile Spec & Track Operational Changes
        run: node scripts/compile-openapi.js

      - name: Commit & Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add public/paystack-enriched.json public/paystack.json public/spec-manifest.json public/changelog.json
          if git diff --staged --quiet; then
            echo "No changes in Paystack Enriched specification."
          else
            git commit -m "chore(spec): sync latest enriched spec & update operational changelog"
            git push
          fi
